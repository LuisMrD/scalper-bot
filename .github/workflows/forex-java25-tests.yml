name: Forex Java 25 tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/forex-java25-tests.yml'
  push:
    branches:
      - feat/forex-eurusd-csv-research

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and run unit tests without broker or DB connections
        run: mvn -B -ntp clean test
