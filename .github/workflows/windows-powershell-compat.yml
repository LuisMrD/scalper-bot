name: Windows PowerShell 5.1 script compatibility

on:
  push:
    branches: ['experiment/1m-vs-5m-trade-diagnostics']

permissions:
  contents: read

jobs:
  windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate short regime script parameter binding in Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          .\scripts\diagnose-short-regimes.ps1 -PrintOnly
          .\scripts\diagnose-short-regimes.ps1 -StartWindow 16 -Windows 6 -PrintOnly
          .\scripts\diagnose-short-regimes.ps1 -StartWindow 22 -Windows 6 -PrintOnly
      - name: Probe real execution path with HTTP intercepted (Windows PowerShell 5.1)
        shell: powershell
        run: |
          function Invoke-RestMethod {
            [CmdletBinding()]
            param([string]$Uri, [int]$TimeoutSec)
            throw 'MOCK_HTTP_INTERCEPTED_NO_NETWORK'
          }
          try {
            .\scripts\diagnose-short-regimes.ps1 -StartWindow 16 -Windows 6
            throw 'DIAGNOSTIC_DID_NOT_ATTEMPT_HTTP'
          } catch {
            if ($_.Exception.Message -notlike '*MOCK_HTTP_INTERCEPTED_NO_NETWORK*') {
              throw
            }
            Write-Host 'PASS: real diagnostic path reached intercepted HTTP with typed Windows intact.'
          }
      - name: Mock all six RANGE windows and CSV aggregation under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-short-range-export.ps1
      - name: Mock six L2 OOS windows with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\validate-range-l2-oos.ps1 -StartWindow 34 -Windows 6 -PrintOnly
          .\scripts\tests\test-range-l2-export.ps1
      - name: Verify LONG context OOS under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\tests\test-long-context-oos.ps1
          .\scripts\tests\test-long-context-export.ps1
      - name: Test retrospective candle and signal audits in Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\tests\test-primary-timeframe-audit.ps1
      - name: Verify BB20 strict close and frozen SMA mean-reversion reports under Windows 5.1
        shell: powershell
        run: .\scripts\tests\test-bollinger-export.ps1
      - name: Bollinger confirmed reversal six-window mock CSV export
        shell: powershell
        run: .\scripts\tests\test-bollinger-confirmation-export.ps1
      - name: Verify 3 symbol 6x300h Bollinger research on PowerShell 5.1
        shell: powershell
        run: .\scripts\tests\test-bollinger-three-symbols.ps1
      - name: Mock full SOL DOGE BTC financial CSV export under Windows PS 5.1
        shell: powershell
        run: .\scripts\tests\test-bollinger-three-symbols-export.ps1
      - name: Mock primary 15m backtest under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\tests\test-primary-timeframe-oos.ps1
          .\scripts\tests\test-primary-timeframe-export.ps1
      - name: Mock offline financial expectancy audit with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-expectancy-audit.ps1
