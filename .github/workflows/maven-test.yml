name: Maven tests (Java 25)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'experiment/1m-vs-5m-trade-diagnostics']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check safe local backtest configuration (does not start app)
        shell: pwsh
        run: |
          $output = & ./scripts/start-backtest.ps1 -PrintOnly
          foreach ($expected in @(
            'SPRING_PROFILES_ACTIVE=backtest',
            'TRADING_ORDERS_ENABLED=false',
            'LUNA_ENABLED=false',
            'MARKET_DATA_WS_ENABLED=false',
            'MARKET_DATA_BOOTSTRAP_ENABLED=false',
            'TRADING_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT',
            'TRADING_CAPITAL_USDT=300',
            'TRADING_RISK_PER_TRADE_PCT=0.5',
            'TRADING_DAILY_STOP_PCT=3',
            'TRADING_LEVERAGE=1',
            'RISK_FEE_PER_SIDE_PCT=0.05',
            'RISK_SLIPPAGE_PER_SIDE_PCT=0.02',
            'JAVA_DECISION_REQUIRE_HIGHER_TF=false',
            'RISK_MAX_COST_TO_INITIAL_RISK_PCT=30'
          )) {
            if ($output -notcontains $expected) { throw "Unexpected local backtest config: $expected" }
          }
          $plan = & ./scripts/compare-pair-backtests.ps1 -PrintOnly
          if ($plan -notcontains 'SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT' -or
              $plan -notcontains 'COST_LIMITS=0,30,50,75,100' -or
              $plan -notcontains 'LUNA=false') {
            throw 'Multi-symbol backtest plan has changed unexpectedly.'
          }
          $singlePair = & ./scripts/compare-pair-backtests.ps1 -Symbols SOLUSDT -CostLimits 0,30 -PrintOnly
          if ($singlePair -notcontains 'SYMBOLS=SOLUSDT' -or
              $singlePair -notcontains 'COST_LIMITS=0,30') {
            throw 'Single-pair test parameters did not bind.'
          }
          $withoutFilter = & ./scripts/start-backtest.ps1 -MaxCostToInitialRiskPct 0 -PrintOnly
          if ($withoutFilter -notcontains 'RISK_MAX_COST_TO_INITIAL_RISK_PCT=<unset>') {
            throw 'Zero filter parameter must UNSET env instead of failing validation.'
          }
      - name: Smoke REST JSON arrays with mock HTTP (no network)
        shell: pwsh
        run: ./scripts/tests/test-rest-json-array-shapes.ps1
      - name: Smoke non-overlapping setups and source checks (mock HTTP only)
        shell: pwsh
        run: ./scripts/tests/test-multiwindow-setups.ps1
      - name: Smoke 1m vs 5m trade expectancy diagnostics (offline)
        shell: pwsh
        run: ./scripts/tests/test-trade-diagnostics.ps1
      - name: Smoke 5m RETEST trade CSV export and capital safety (mock HTTP)
        shell: pwsh
        run: ./scripts/tests/test-trade-export.ps1
      - name: Smoke OOS profit protection 6 x 300-hour window plan (offline)
        shell: pwsh
        run: ./scripts/tests/test-profit-protection-oos.ps1
      - name: Smoke audit of 9 entry-signal windows (offline)
        shell: pwsh
        run: ./scripts/tests/test-entry-audit.ps1
      - name: Smoke dynamic RETEST entry filter 9-window plan (offline)
        shell: pwsh
        run: ./scripts/tests/test-entry-filter-comparison.ps1
      - name: Smoke replacement entry cohorts and PnL reconciliation (offline)
        shell: pwsh
        run: ./scripts/tests/test-replacement-entries.ps1
      - name: Smoke 15m range reentry wait and fixed 15-60 min controls (offline)
        shell: pwsh
        run: ./scripts/tests/test-reentry-waits.ps1
      - name: Smoke frozen OOS six new 300-hour reentry windows (offline)
        shell: pwsh
        run: ./scripts/tests/test-reentry-oos.ps1
      - name: Smoke cross-asset SOL-BTC-ETH macro study (offline)
        shell: pwsh
        run: ./scripts/tests/test-cross-asset-macro.ps1
      - name: Smoke frozen 3-6-9h BTC ETH macro research windows (offline)
        shell: pwsh
        run: ./scripts/tests/test-magic-macro-oos.ps1
      - name: Smoke frozen SHORT_ONLY vs selected 6h-3h and 9h-3h macro OOS (offline)
        shell: pwsh
        run: ./scripts/tests/test-long-vs-short-oos.ps1
      - name: Smoke retrospective SHORT regime and stop diagnostics (offline)
        shell: pwsh
        run: ./scripts/tests/test-short-regime-diagnostics.ps1
      - name: Validate and test (no real orders)
        run: mvn -B -ntp verify
