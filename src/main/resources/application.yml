spring:
  application:
    name: binance-scalping-bot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/trading_bot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trading:
  symbols: ${TRADING_SYMBOLS:BTCUSDT}
  execution:
    mode: DISABLED
    orders-enabled: ${TRADING_ORDERS_ENABLED:false}
  risk:
    capital-usdt: ${TRADING_CAPITAL_USDT:}
    risk-per-trade-pct: ${TRADING_RISK_PER_TRADE_PCT:}
    daily-stop-pct: ${TRADING_DAILY_STOP_PCT:}
    leverage: ${TRADING_LEVERAGE:}

integrations:
  binance:
    rest-base-url: https://demo-fapi.binance.com
    websocket-base-url: wss://demo-fstream.binance.com
  openai:
    enabled: false
    model: gpt-6-luna

# Etapa 2: sincronizacao automatica e WS desligados por padrao.
market-data:
  intervals: ${MARKET_DATA_INTERVALS:1m,5m,15m}
  websocket-enabled: ${MARKET_DATA_WS_ENABLED:false}
  websocket-stream-path: ${MARKET_DATA_WS_PATH:/market/stream}
  bootstrap-enabled: ${MARKET_DATA_BOOTSTRAP_ENABLED:false}
  bootstrap-days: ${MARKET_DATA_BOOTSTRAP_DAYS:7}
  page-limit: ${MARKET_DATA_PAGE_LIMIT:1000}
  max-pages-per-request: ${MARKET_DATA_MAX_PAGES:30}
  reconcile-lookback-minutes: ${MARKET_DATA_RECONCILE_MINUTES:120}
  websocket-check-ms: ${MARKET_DATA_WS_RECONNECT_MS:30000}
  scheduler:
    initial-delay-ms: 15000
    interval-ms: 60000

# Etapa 3: heuristicas configuraveis do analisador Al Brooks (somente leitura).
price-action:
  min-candles: ${PRICE_ACTION_MIN_CANDLES:20}
  pivot-left: ${PRICE_ACTION_PIVOT_LEFT:2}
  pivot-right: ${PRICE_ACTION_PIVOT_RIGHT:2}
  breakout-lookback: ${PRICE_ACTION_BREAKOUT_LOOKBACK:10}
  recent-bar-count: ${PRICE_ACTION_RECENT_BARS:20}
  trend-body-min-ratio: ${PRICE_ACTION_TREND_BODY_MIN:0.60}
  doji-body-max-ratio: ${PRICE_ACTION_DOJI_BODY_MAX:0.25}
  rejection-wick-min-ratio: ${PRICE_ACTION_REJECTION_WICK_MIN:0.50}

# Etapa 4: thresholds empiricos do VPA. Nao sao regras prescritas por Coulling.
volume-analysis:
  lookback: ${VOLUME_LOOKBACK:20}
  recent-count: ${VOLUME_RECENT_COUNT:20}
  high-volume-ratio: ${VOLUME_HIGH_RATIO:1.8}
  low-volume-ratio: ${VOLUME_LOW_RATIO:0.6}
  wide-spread-ratio: ${VOLUME_WIDE_SPREAD_RATIO:1.5}
  narrow-spread-ratio: ${VOLUME_NARROW_SPREAD_RATIO:0.7}
  strong-taker-share: ${VOLUME_TAKER_SHARE:0.6}
  min-body-ratio: ${VOLUME_MIN_BODY_RATIO:0.55}
  extreme-close-ratio: ${VOLUME_EXTREME_CLOSE_RATIO:0.75}

# Etapa 5: zonas por pivots Brooks confirmados e Fibonacci do ultimo swing confirmado.
# Valores iniciais SAO heuristicas de software; nao garantem qualidade de niveis.
market-levels:
  atr-lookback: ${MARKET_LEVELS_ATR_LOOKBACK:14}
  atr-zone-multiplier: ${MARKET_LEVELS_ATR_MULTIPLIER:0.5}
  min-zone-tolerance-pct: ${MARKET_LEVELS_MIN_ZONE_PCT:0.10}
  max-zones: ${MARKET_LEVELS_MAX_ZONES:12}

# Etapa 6: numero de candles OHLCV recentes anexados a cada contexto de mercado.
market-context:
  recent-candles: ${MARKET_CONTEXT_RECENT_CANDLES:30}

# Etapa 7: motor Java experimental. Nao executa ordens e nao define risco.
java-decision:
  breakout-lookback: ${JAVA_DECISION_BREAKOUT_LOOKBACK:10}
  retest-max-bars: ${JAVA_DECISION_RETEST_MAX_BARS:4}
  max-primary-staleness-bars: ${JAVA_DECISION_MAX_STALENESS_BARS:2}
  require-higher-timeframe-alignment: ${JAVA_DECISION_REQUIRE_HIGHER_TF:true}
  require-dominant-taker-volume: ${JAVA_DECISION_REQUIRE_TAKER:true}
  pullback-enabled: ${JAVA_DECISION_PULLBACK_ENABLED:true}
  breakout-retest-enabled: ${JAVA_DECISION_RETEST_ENABLED:true}
